server:
  port: 8080

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      routes:
        # product-service on host
        - id: product-products
          uri: http://host.docker.internal:3005
          predicates:
            - Path=/api/products/**
        - id: product-stocks
          uri: http://host.docker.internal:3005
          predicates:
            - Path=/api/stocks/**
        - id: product-warehouses
          uri: http://host.docker.internal:3005
          predicates:
            - Path=/api/warehouses/**

        # purchase-service
        - id: purchase-orders
          uri: http://host.docker.internal:3003
          predicates:
            - Path=/api/purchaseorders/**
        - id: purchase-suppliers
          uri: http://host.docker.internal:3003
          predicates:
            - Path=/api/suppliers/**

        # sales-service
        - id: sales
          uri: http://host.docker.internal:8083
          predicates:
            - Path=/api/v1/sales/**
