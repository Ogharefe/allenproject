databaseChangeLog:
  - changeSet:
      id: create-stock-transactions-table
      author: allen
      changes:
        - createTable:
            tableName: stock_transactions
            columns:
              - column:
                  name: stock_transaction_id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: product_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: product_sku
                  type: varchar(50)
                  constraints:
                    nullable: false
              - column:
                  name: warehouse_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: warehouse_name
                  type: varchar(100)
                  constraints:
                    nullable: false
              - column:
                  name: type
                  type: varchar(50)
                  constraints:
                    nullable: false
              - column:
                  name: quantity_change
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: resulting_quantity
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: transaction_date
                  type: timestamp
                  constraints:
                    nullable: false