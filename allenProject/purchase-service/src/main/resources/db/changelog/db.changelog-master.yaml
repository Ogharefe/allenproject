databaseChangeLog:
  - changeSet:
      id: 1-create-supplier-table
      author: auto-generated
      changes:
        - createTable:
            tableName: supplier
            columns:
              - column:
                  name: supplier_id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
              - column:
                  name: contact_person
                  type: VARCHAR(255)
              - column:
                  name: email
                  type: VARCHAR(255)
              - column:
                  name: phone_number
                  type: VARCHAR(50)
              - column:
                  name: address
                  type: VARCHAR(500)

  - changeSet:
      id: 2-create-purchase-order-table
      author: auto-generated
      changes:
        - createTable:
            tableName: purchase_order
            columns:
              - column:
                  name: purchase_order_id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: supplier_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: order_date
                  type: DATE
              - column:
                  name: expected_delivery_date
                  type: DATE
              - column:
                  name: status
                  type: VARCHAR(50)
        - addForeignKeyConstraint:
            baseTableName: purchase_order
            baseColumnNames: supplier_id
            constraintName: fk_purchase_order_supplier
            referencedTableName: supplier
            referencedColumnNames: supplier_id
            onDelete: CASCADE

  - changeSet:
      id: 4-add-supplier-name-to-purchase-order
      author: allen
      changes:
        - addColumn:
            tableName: purchase_order
            columns:
              - column:
                  name: supplier_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: true

  - changeSet:
      id: 3-create-purchase-order-line-table
      author: auto-generated
      changes:
        - createTable:
            tableName: purchase_order_line
            columns:
              - column:
                  name: line_id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: product_id
                  type: BIGINT
              - column:
                  name: quantity_ordered
                  type: INT
              - column:
                  name: unit_price
                  type: DECIMAL(19,4)
              - column:
                  name: total_price
                  type: DECIMAL(19,4)
              - column:
                  name: purchase_order_id
                  type: BIGINT
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: purchase_order_line
            baseColumnNames: purchase_order_id
            constraintName: fk_purchase_order_line_purchase_order
            referencedTableName: purchase_order
            referencedColumnNames: purchase_order_id
            onDelete: CASCADE
  - changeSet:
      id: 5-add-warehouse-id-to-purchase-order-line
      author: allen
      changes:
        - addColumn:
            tableName: purchase_order_line
            columns:
              - column:
                  name: warehouse_id
                  type: BIGINT
                  constraints:
                    nullable: true
