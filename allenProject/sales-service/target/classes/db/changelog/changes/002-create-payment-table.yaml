databaseChangeLog:
  - changeSet:
      id: 002-create-payment-table
      author: allen
      changes:
        - createTable:
            tableName: payments
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: method
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: amount
                  type: DECIMAL(19, 2)
                  constraints:
                    nullable: false
              - column:
                  name: payment_date
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: sale_id
                  type: UUID

        - addForeignKeyConstraint:
            baseTableName: payments
            baseColumnNames: sale_id
            referencedTableName: sales_orders
            referencedColumnNames: id
            constraintName: fk_payments_sales_orders
            onDelete: CASCADE
            
        - dropColumn:
            tableName: sales_orders
            columnName: payment