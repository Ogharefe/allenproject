spring:
  application:
    name: sales-service

  kafka:
    bootstrap-servers: ${KAFKA_HOST:kafka}:${KAFKA_PORT:9092}

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:postgres-sales}:${POSTGRES_PORT:5432}/${POSTGRES_DB:sales_db}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:admin}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  cloud:
    stream:
      function:
        definition: productCreatedConsumer
      bindings:
        productCreatedConsumer-in-0:
          destination: product-creation-events
          group: sales-service
          contentType: application/json
      kafka:
        binder:
          brokers: ${KAFKA_HOST:kafka}:${KAFKA_PORT:9092}

server:
  port: 8083
